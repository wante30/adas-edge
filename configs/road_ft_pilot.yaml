# Road-domain pilot recipe (round 2). Consumed by tools/run_road_pilot.py --config.
#
# The authoritative dataset config is generated by tools/prepare_nuimages_road_subset.py
# into <output>/dataset.yaml: 80 COCO names and COCO label ids, so Ultralytics keeps
# the pretrained 80-class head instead of re-initialising it (head option A).
#
# The frozen BDD100K 1000-image holdout is never referenced here.

dataset: D:/Datasets/adas_edge_nuimages_road_5k/dataset.yaml
weights: yolo11n.pt

# mosaic is 0.0 for BOTH pilots: rect=True zeroes mosaic inside YOLODataset, so
# leaving it on for the square pilot would confound geometry with augmentation.
epochs: 25
batch: 16
mosaic: 0.0
mixup: 0.0
cutmix: 0.0
seed: 0
patience: 50

pilots:
  # road-domain adaptation at the existing square geometry -> isolates the data
  # domain when compared against BASE-320.
  Road-FT-320:
    slug: "320"
    imgsz: 320
    rect: false
    expected_input: 320x320

  # road-domain adaptation at 16:9 -> for this all-1600x900 subset batch_shapes
  # resolve to ceil([0.5625, 1] * 512 / 32) * 32 = [288, 512].
  Road-FT-512x288:
    slug: "512x288"
    imgsz: 512
    rect: true
    expected_input: 512x288
